id = nekodrome
name = NekoDrome
tagline = Your Navidrome library, in your hands.
summary = A native Navidrome client written in C++ with SDL2 in NekoUI, built to be driven with a controller as comfortably as with a mouse.
description = """
NekoDrome is a native client for [Navidrome](https://www.navidrome.org/) servers.

It is written in C++ on top of SDL2 and uses **NekoUI**, a header-only UI library, so the interface works well with a gamepad as well as a keyboard and mouse.

- Native desktop build for Linux
- Controller-first navigation
- Material 3 Expressive inspired look with the nekoppuccin palette
"""
screenshots = "nekpo/screenshots/1.png, nekpo/screenshots/2.png, nekpo/screenshots/3.png, nekpo/screenshots/4.png, nekpo/screenshots/5.png, nekpo/screenshots/6.png, nekpo/screenshots/7.png, nekpo/screenshots/8.png, nekpo/screenshots/9.png"
author = Akiko NekoMimi
license = Apache-2.0
website = "http://nekomimi.nekos.team/docs/NekoDrome"
source = "https://github.com/NekoMimiOfficial/NekoDrome"
category = Music
tags = navidrome, subsonic, music, sdl2, nekoui
